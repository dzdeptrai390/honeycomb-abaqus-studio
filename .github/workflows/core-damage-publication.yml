# Refresh Actions discovery after repository provisioning.
name: Core damage · retry publication only
run-name: core-damage-upload · ${{ inputs.ticket }}
on:
  workflow_dispatch:
    inputs:
      campaign_id:
        required: true
        type: string
      ticket:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      original_run_id:
        required: true
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: core-damage-upload-${{ inputs.ticket }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CAMPAIGN_ID: ${{ inputs.campaign_id }}
      TICKET: ${{ inputs.ticket }}
      ORIGINAL_RUN_ID: ${{ inputs.original_run_id }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked --extra cloud --extra campaign
      - name: Claim upload attempt without changing solver identity
        run: uv run --locked --extra cloud python scripts/campaign_publish.py claim
      - uses: actions/download-artifact@v8.0.1
        with:
          name: core-damage-${{ inputs.ticket }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.original_run_id }}
          path: /tmp/honeycomb-results
      - run: uv run --locked --extra cloud python scripts/campaign_publish.py run
