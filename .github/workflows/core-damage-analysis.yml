# Refresh Actions discovery after repository provisioning.
name: Core damage · surrogates and Pareto
run-name: core-damage-analysis · ${{ inputs.ticket }}
on:
  workflow_dispatch:
    inputs:
      ticket:
        required: true
        type: string
      source_sha:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: core-damage-controller
  cancel-in-progress: false
jobs:
  analyze:
    if: github.repository == 'xuankhanh24/honeycomb-abaqus-studio'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked --extra cloud --extra campaign
      - name: Compare nested CV, choose new designs, then open locked test labels
        env:
          CAMPAIGN_APP_ID: ${{ vars.CAMPAIGN_APP_ID }}
          CAMPAIGN_APP_PRIVATE_KEY: ${{ secrets.CAMPAIGN_APP_PRIVATE_KEY }}
          ANALYSIS_TICKET: ${{ inputs.ticket }}
        run: uv run --locked --extra cloud --extra campaign python scripts/campaign_analysis.py
