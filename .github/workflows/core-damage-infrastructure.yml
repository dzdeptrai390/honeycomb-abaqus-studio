# Refresh Actions discovery after repository provisioning.
name: Core damage · repository infrastructure validation
on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: write
  id-token: write
jobs:
  infrastructure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      ABAQUS_MEDIA_DRIVE_FILE_ID: ${{ vars.ABAQUS_MEDIA_DRIVE_FILE_ID }}
      ABAQUS_LICENSE_ENDPOINT: ${{ secrets.ABAQUS_LICENSE_ENDPOINT }}
      ABAQUS_VENDOR_PORT: ${{ secrets.ABAQUS_VENDOR_PORT }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked --extra cloud --extra campaign
      - uses: ./.github/actions/abaqus-runtime
        with:
          tailscale_id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          drive_credentials: ${{ secrets.HONEYCOMB_DRIVE_CREDENTIALS_JSON }}
      - run: uv run --locked --extra cloud python scripts/campaign_validate.py
      - run: uv run --locked --extra cloud python scripts/campaign_evidence.py infrastructure
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: core-damage-infrastructure-${{ github.run_id }}
          retention-days: 30
          path: |
            output/*.json
            output/actions-logs/**
            /tmp/honeycomb-material-validation/**
